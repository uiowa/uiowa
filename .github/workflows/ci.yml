name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Grant workflow token read access to repository contents
permissions:
  contents: read
  packages: read

jobs:
  # Linting job - fast feedback
  lint:
    name: Code Standards (PHPCS)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, pdo_mysql
          coverage: none

      - name: Configure Git and Composer authentication
        run: |
          # Configure git to rewrite SSH URLs to HTTPS (must be done BEFORE cache).
          # Needed for a few packages that use SSH source for fallback.
          # Not used in the normal --prefer-dist path; this only guards the rare dist-download fallback
          # to `git clone` so CI doesn't fail on a missing SSH key for an unrelated dependency.
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "git@github.com:"
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "ssh://git@github.com/"

          # Configure Composer authentication using multiple methods for reliability
          composer config -g github-oauth.github.com ${{ secrets.GITHUB_TOKEN }}
          composer config -g github-protocols https

          # Verify the configuration
          echo "Git URL rewrites configured with token authentication"
          git config --global --get-regexp url || true

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: |
            vendor
            docroot/core
            docroot/modules/contrib
            docroot/themes/contrib
            docroot/profiles/contrib
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'
        run: |
          # Validate cache integrity - if vendor exists but core doesn't, clear vendor
          if [ -d "vendor" ] && [ ! -d "docroot/core" ]; then
            echo "Cache inconsistency detected: vendor exists but docroot/core missing"
            echo "Clearing vendor to force fresh install..."
            rm -rf vendor
          fi

          composer install --no-interaction --prefer-dist --verbose

          # Verify phpcs was installed
          if [ ! -f vendor/bin/phpcs ]; then
            echo "ERROR: phpcs not installed!"
            echo "Checking vendor directory:"
            ls -la vendor/ || echo "vendor directory not found"
            exit 1
          fi
          echo "✓ Composer dependencies installed successfully"

      - name: Run PHPCS
        run: scripts/ci/lint.sh

  # Static analysis job
  static-analysis:
    name: Static Analysis (PHPStan)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, pdo_mysql
          coverage: none

      - name: Configure Git and Composer authentication
        run: |
          # Configure git to rewrite SSH URLs to HTTPS with token (must be BEFORE cache)
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "git@github.com:"
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "ssh://git@github.com/"

          # Configure Composer authentication
          composer config -g github-oauth.github.com ${{ secrets.GITHUB_TOKEN }}
          composer config -g github-protocols https

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: |
            vendor
            docroot/core
            docroot/modules/contrib
            docroot/themes/contrib
            docroot/profiles/contrib
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'
        run: |
          # Validate cache integrity - if vendor exists but core doesn't, clear vendor
          if [ -d "vendor" ] && [ ! -d "docroot/core" ]; then
            echo "Cache inconsistency detected: vendor exists but docroot/core missing"
            echo "Clearing vendor to force fresh install..."
            rm -rf vendor
          fi

          composer install --no-interaction --prefer-dist

      - name: Run PHPStan
        run: scripts/ci/static-analysis.sh

  # Security audit job
  security:
    name: Security Audit (Composer)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, pdo_mysql
          coverage: none

      - name: Configure Git and Composer authentication
        run: |
          # Configure git to rewrite SSH URLs to HTTPS with token (must be BEFORE cache)
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "git@github.com:"
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "ssh://git@github.com/"

          # Configure Composer authentication
          composer config -g github-oauth.github.com ${{ secrets.GITHUB_TOKEN }}
          composer config -g github-protocols https

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: |
            vendor
            docroot/core
            docroot/modules/contrib
            docroot/themes/contrib
            docroot/profiles/contrib
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'
        run: |
          # Validate cache integrity - if vendor exists but core doesn't, clear vendor
          if [ -d "vendor" ] && [ ! -d "docroot/core" ]; then
            echo "Cache inconsistency detected: vendor exists but docroot/core missing"
            echo "Clearing vendor to force fresh install..."
            rm -rf vendor
          fi

          composer install --no-interaction --prefer-dist

      - name: Run Security Audit
        run: scripts/ci/security.sh

  # PHPUnit tests job - all test types
  test:
    name: PHPUnit Tests
    runs-on: ubuntu-22.04

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: drupal_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, pdo_mysql, memcache
          coverage: none

      - name: Configure Git and Composer authentication
        run: |
          # Configure git to rewrite SSH URLs to HTTPS with token (must be BEFORE cache)
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "git@github.com:"
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "ssh://git@github.com/"

          # Configure Composer authentication
          composer config -g github-oauth.github.com ${{ secrets.GITHUB_TOKEN }}
          composer config -g github-protocols https

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: |
            vendor
            docroot/core
            docroot/modules/contrib
            docroot/themes/contrib
            docroot/profiles/contrib
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'
        run: |
          # Validate cache integrity - if vendor exists but core doesn't, clear vendor
          if [ -d "vendor" ] && [ ! -d "docroot/core" ]; then
            echo "Cache inconsistency detected: vendor exists but docroot/core missing"
            echo "Clearing vendor to force fresh install..."
            rm -rf vendor
          fi

          composer install --no-interaction --prefer-dist

      - name: Setup test environment and web server
        run: scripts/ci/setup.sh
        env:
          CI: true
          INSTALL_DRUPAL: true
          RUN_SERVER: true

      - name: Run PHPUnit tests
        run: scripts/ci/test.sh
        env:
          CI: true
          SIMPLETEST_DB: mysql://drupal:drupal@127.0.0.1/drupal_test
          SIMPLETEST_BASE_URL: http://localhost:8080

  # Build frontend assets
  frontend:
    name: Frontend Build
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --production --ignore-optional --frozen-lockfile --non-interactive

      - name: Build frontend assets
        run: yarn workspaces run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-assets
          path: |
            docroot/themes/*/dist/
            docroot/modules/*/dist/
          retention-days: 7

  # Percy visual regression testing. Scoped to pull requests only so we
  # don't burn snapshot quota on every push to main/develop as well.
  percy:
    name: Percy Visual Regression
    runs-on: ubuntu-22.04
    if: github.event_name == 'pull_request'

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: drupal_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, pdo_mysql
          coverage: none
          ini-values: memory_limit=-1, max_execution_time=0

      - name: Configure Git and Composer authentication
        run: |
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "git@github.com:"
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "ssh://git@github.com/"
          composer config -g github-oauth.github.com ${{ secrets.GITHUB_TOKEN }}
          composer config -g github-protocols https

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: |
            vendor
            docroot/core
            docroot/modules/contrib
            docroot/themes/contrib
            docroot/profiles/contrib
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'
        run: composer install --no-interaction --prefer-dist

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --production --ignore-optional --frozen-lockfile --non-interactive

      - name: Build frontend assets
        run: yarn workspaces run build

      - name: Setup test environment and web server
        run: scripts/ci/setup.sh
        env:
          CI: true
          INSTALL_DRUPAL: true
          RUN_SERVER: true

      - name: Debug - inspect pages Percy will snapshot
        run: |
          source ./tmp/ci-env.sh
          echo "=== Env vars this step sees ==="
          echo "SIMPLETEST_DB=$SIMPLETEST_DB"
          echo "pwd=$(pwd)"
          echo
          echo "=== What settings.php actually resolves \$databases to ==="
          vendor/bin/drush --root=docroot php:eval 'var_export($GLOBALS["databases"] ?? "NOT SET");' 2>&1 || true
          echo
          echo "=== Tables that actually exist in that connection ==="
          vendor/bin/drush --root=docroot sql-query "SHOW TABLES" 2>&1 || true
          echo
          echo "=== Drush status ==="
          vendor/bin/drush --root=docroot status --fields=drupal-version,db-status,bootstrap,theme,default-theme || true
          echo
          echo "=== Content counts ==="
          vendor/bin/drush --root=docroot sql-query "SELECT COUNT(*) AS nodes FROM node_field_data" || true
          vendor/bin/drush --root=docroot sql-query "SELECT COUNT(*) AS block_content FROM block_content_field_data" || true
          vendor/bin/drush --root=docroot sql-query "SELECT COUNT(*) AS path_aliases FROM path_alias" || true
          echo
          echo "=== Recent watchdog errors (if dblog enabled) ==="
          vendor/bin/drush --root=docroot watchdog:show --count=30 --severity=Error 2>&1 || true
          echo
          for path in / /about /people /people/herky-hawk /news /news/2019/09/demo-article; do
            url="${SIMPLETEST_BASE_URL}${path}"
            echo "=== $url ==="
            code=$(curl -s -o /tmp/page.html -w '%{http_code}' "$url")
            echo "HTTP status: $code"
            echo "Bytes: $(wc -c < /tmp/page.html)"
            grep -o 'uiowa-alerts-wrapper\|search-button\|block-inline-blockuiowa-events' /tmp/page.html | sort -u || echo "(none of the expected selectors found)"
            echo
          done

      - name: Run Percy snapshot
        run: scripts/ci/percy.sh
        env:
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
