name: Sitenow Intranet
type: module
description: Functionality for intranet-type sites.
package: University of Iowa
core_version_requirement: ^10 || ^11
dependencies:
  - drupal:allowed_formats
  # hook_file_download() uses file_get_content_headers() and file.repository.
  - drupal:file
  # Required, not optional: the search server in config/install declares a
  # dependency on search_api_db, and Drupal validates those dependencies
  # before hook_install() runs. Enabling it any later leaves the config
  # objects rejected with nothing to repair them.
  - drupal:search_api_db
  - drupal:views
