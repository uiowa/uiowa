services:
  logger.channel.uiowa_core:
    parent: logger.channel_base
    arguments: [ 'uiowa_core' ]
  uiowa_core.new_relic_exception_subscriber:
    class: Drupal\uiowa_core\EventSubscriber\NewRelicExceptionSubscriber
    tags:
      - { name: event_subscriber }
  uiowa_core.route_subscriber:
    class: 'Drupal\uiowa_core\Routing\UiowaCoreRouteSubscriber'
    tags:
      - { name: event_subscriber }
  uiowa_core.access_checker:
    class: Drupal\uiowa_core\Access\UiowaCoreAccess
    arguments: ['@current_user']
    tags:
      - { name: access_check, applies_to: _uiowa_core_access_check }
  uiowa_core.file_scheme_migrator:
    class: Drupal\uiowa_core\FileSchemeMigrator
    arguments:
      - '@entity_type.manager'
      - '@entity_field.manager'
      - '@file_system'
      - '@file.repository'
      - '@stream_wrapper_manager'
      - '@database'
      - '@logger.channel.uiowa_core'
