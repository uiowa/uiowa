uiowa_profiles.settings:
  type: config_object
  label: 'Settings for profile directories.'
  mapping:
    environment:
      type: string
      label: 'Profiles environment override (test or prod). Unset uses the Acquia environment.'
    directories:
      type: sequence
      label: 'A directory.'
      sequence:
        type: mapping
        mapping:
          title:
            type: string
          api_key:
            type: text
          path:
            type: string
          page_size:
            type: integer
          intro:
            type: mapping
            mapping:
              value:
                type: string
              format:
                type: string
